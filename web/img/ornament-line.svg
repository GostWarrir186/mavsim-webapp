<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 153" width="246" height="153" preserveAspectRatio="none">
  <!-- Линейный чакан из брендбука MAVSIM, перерисованный вектором.
       Растровый фрагмент со слайда повторялся со швами: шаг элементов
       в нём плыл с 255 до 240 px. Здесь один период ровно 246 —
       repeat-x стыкуется без разрывов.

       Раскладка: трилистник строго в центре периода, иначе его правый
       боковой лист упирается в край viewBox и срезается. Ромб стоит на
       обеих границах половинками — при повторе они складываются в целый. -->
  <!-- Цвета строго из брендбука (слайд «Colors»): #00875d — фирменный
       зелёный, #f77428 — главный фирменный оранжевый. Раньше зелёный был
       #0d4436 — темнее брендового и ни в одной палитре не значился. -->
  <g fill="#00875d">
    <rect x="0" y="3" width="246" height="16"/>
    <rect x="0" y="134" width="246" height="16"/>
  </g>
  <g fill="#f77428">
    <path d="M0 53 26 82 0 111 -26 82Z"/>
    <path d="M246 53 272 82 246 111 220 82Z"/>
  </g>
  <g fill="#00875d" transform="translate(123 130)">
    <path d="M0 0Q41 -57 0 -104Q-41 -57 0 0Z"/>
    <path d="M0 0Q33 -45 0 -86Q-33 -45 0 0Z" transform="rotate(64)"/>
    <path d="M0 0Q33 -45 0 -86Q-33 -45 0 0Z" transform="rotate(-64)"/>
  </g>
</svg>
